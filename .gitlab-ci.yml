variables:
  IMAGE_NAME: "ms-enrolment-frontend"
  TAG: ""
  NO_PROXY: "repo-prod.gbp.cpm.net"
  HTTP_PROXY: ""
  HTTPS_PROXY: ""

stages:
  - build

before_script:
  - echo "Logging in to Nexus..."
  - echo "$NEXUS_PASSWORD" | docker login "$NEXUS_REGISTRY" --username "$NEXUS_USER" --password-stdin
  - export VERSION=$(sed -n 's/^[[:space:]]*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' package.json | head -n 1)
  - export VERSION_TAG="${VERSION:-${CI_COMMIT_SHORT_SHA}}"
  - echo "Building version $VERSION_TAG"

build:
  stage: build

  script:
    - echo "Creating temporary npm authentication..."
    - printf 'registry=https://repo-prod.gbp.cpm.net/repository/npm-proxy/\n//repo-prod.gbp.cpm.net/repository/npm-proxy/:_auth=%s\n' "$(printf '%s:%s' "$NEXUS_USER" "$NEXUS_PASSWORD" | base64 -w0)" > /tmp/npmrc.ci

    - echo "Building and pushing frontend image..."
    - docker build --add-host=repo-prod.gbp.cpm.net:10.250.9.203 --secret id=npmrc,src=/tmp/npmrc.ci --build-arg VITE_API_URL="${VITE_API_URL:-https://enrolment-uat-api.gbp.cpm.net}" -t "$NEXUS_REGISTRY/$IMAGE_NAME:$VERSION_TAG" .

    - rm -f /tmp/npmrc.ci

    - echo "Pushing image..."
    - docker push "$NEXUS_REGISTRY/$IMAGE_NAME:$VERSION_TAG"

  rules:
    - if: '$CI_COMMIT_BRANCH'